version: "3.9"

# Minimal local dev stack.
# Only Redis is needed — SQLite and local file storage handle the rest.
# Run:  docker compose up -d
#       docker compose down

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
